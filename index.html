<style>
  :root {
    --color-bg-primary: #FFFFFF;
    --color-bg-secondary: #F5F4EE;
    --color-bg-tertiary: #ECEAE2;
    --color-text-primary: #1F1E1D;
    --color-text-secondary: #5A5852;
    --color-text-tertiary: #888780;
    --color-border-tertiary: #E5E3DA;
    --color-border-secondary: #C8C5BB;
    --color-border-primary: #888780;
    --color-bg-info: #E6F1FB;
    --color-text-info: #0C447C;
    --color-border-info: #185FA5;
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-bg-secondary);
    color: var(--color-text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .page {
    max-width: 1600px;
    margin: 0 auto;
    padding: 1.5rem 2rem;
  }
  button, input, select {
    font-family: inherit;
    font-size: inherit;
  }
  button {
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-md);
    padding: 6px 12px;
    cursor: pointer;
    color: var(--color-text-primary);
  }
  button:hover { background: var(--color-bg-secondary); }
  input[type="text"], input[type="date"], select {
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    background: var(--color-bg-primary);
    color: var(--color-text-primary);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 1rem;
    font-weight: 600;
    color: var(--color-text-primary);
  }

  .pro-tab {
    padding: 8px 14px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-bg-primary);
    border-radius: var(--radius-md);
    cursor: pointer;
    color: var(--color-text-secondary);
    transition: all 0.15s;
    font-size: 13px;
    white-space: nowrap;
  }
  .pro-tab:hover { background: var(--color-bg-secondary); }
  .pro-tab.active-petram   { background: #F9D6D6 !important; color: #6B1A1A !important; border: 0.5px solid #A32D2D !important; font-weight: 500; }
  .pro-tab.active-her      { background: #F9D6D6 !important; color: #6B1A1A !important; border: 0.5px solid #A32D2D !important; font-weight: 500; }
  .pro-tab.active-vcc      { background: #DCD9F0 !important; color: #312A6E !important; border: 0.5px solid #6A5FC4 !important; font-weight: 500; }
  .pro-tab.active-immo     { background: #DCD9F0 !important; color: #312A6E !important; border: 0.5px solid #6A5FC4 !important; font-weight: 500; }
  .pro-tab.active-invest   { background: #DCD9F0 !important; color: #312A6E !important; border: 0.5px solid #6A5FC4 !important; font-weight: 500; }
  .pro-tab.active-gaac     { background: #D5E7F8 !important; color: #0C447C !important; border: 0.5px solid #185FA5 !important; font-weight: 500; }
  .pro-tab.active-nest     { background: #D6EBC8 !important; color: #1F3F08 !important; border: 0.5px solid #4D8019 !important; font-weight: 500; }
  .pro-tab.active-redac    { background: #D6EBC8 !important; color: #1F3F08 !important; border: 0.5px solid #4D8019 !important; font-weight: 500; }

  .tab-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .tab-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .tab-group-sep {
    width: 1px;
    height: 22px;
    background: var(--color-border-tertiary);
    margin: 0 18px;
  }

  .col-wrap {
    display: grid;
    gap: 12px;
  }
  .col-wrap.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .col-wrap.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .col {
    background: var(--color-bg-tertiary);
    border-radius: var(--radius-md);
    padding: 10px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .col.drag-over {
    background: var(--color-bg-info);
    outline: 1.5px dashed var(--color-border-info);
  }
  .col-head {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 4px;
  }
  .col-title {
    flex: 1;
    background: transparent;
    border: 0.5px solid transparent;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    padding: 4px 8px;
    border-radius: 4px;
  }
  .col-title:hover { border-color: var(--color-border-tertiary); background: var(--color-bg-primary); }
  .col-title:focus { border-color: var(--color-border-secondary); background: var(--color-bg-primary); outline: none; }

  .todo-card {
    border-radius: var(--radius-md);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-bg-primary);
    overflow: hidden;
    position: relative;
    cursor: grab;
  }
  .todo-card:active { cursor: grabbing; }
  .todo-card.dragging { opacity: 0.4; }
  .todo-card.overdue::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 3px;
    background: #A32D2D;
  }
  .todo-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    font-weight: 500;
    font-size: 14px;
  }
  .todo-body { padding: 8px 10px 10px; }
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    padding: 3px 0 3px 0;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
  }
  .todo-item.sub { padding-left: 18px; }
  .todo-item.sub.sub-2 { padding-left: 36px; }

  /* Poignée drag : visible au survol uniquement */
  .drag-handle {
    width: 12px;
    flex-shrink: 0;
    cursor: grab;
    color: var(--color-text-tertiary);
    font-size: 12px;
    line-height: 1.4;
    margin-top: 2px;
    opacity: 0;
    transition: opacity 0.1s;
    user-select: none;
    text-align: center;
  }
  .drag-handle:active { cursor: grabbing; }
  .todo-item:hover .drag-handle { opacity: 0.6; }
  .todo-item:hover .drag-handle:hover { opacity: 1; }

  /* Contrôles (flèches, +, x) visibles au survol uniquement */
  .todo-item .task-controls {
    display: flex;
    align-items: flex-start;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .todo-item:hover .task-controls { opacity: 1; }

  .todo-item.dragging {
    opacity: 0.35;
  }
  .drop-indicator {
    height: 2px;
    background: var(--color-border-info);
    margin: -1px 0;
    border-radius: 2px;
    pointer-events: none;
  }
  .drop-indicator.as-child {
    background: transparent;
    border: 1.5px dashed var(--color-border-info);
    height: 22px;
    border-radius: 4px;
    margin: 2px 0 2px 18px;
    display: flex;
    align-items: center;
    padding-left: 8px;
    font-size: 11px;
    color: var(--color-text-info);
  }
  .drop-indicator.as-child::after { content: '↳ sous-tâche'; }
  .check {
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 1.5px solid var(--color-border-secondary);
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }

  .alert-badge {

  .cal-popover .palette-line .swatch {

  .cal-tooltip {

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);

    align-items: flex-start;
    justify-content: center;
    padding-top: 60px;
    z-index: 1000;
  }
  .modal {

  .color-pick { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }

  .color-swatch.selected { border-color: var(--color-text-primary); }
  .emoji-pick { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .emoji-opt {

  }
  .emoji-opt.selected {
    border: 2px solid var(--color-text-primary) !important;
    background: var(--color-bg-secondary);
  }

  .empty-col {
    text-align: center;
    padding: 1.5rem 0.5rem;
    color: var(--color-text-tertiary);
    font-size: 12px;
    border: 0.5px dashed var(--color-border-tertiary);
    border-radius: var(--radius-md);
  }
  .add-btn {
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    padding: 3px 6px;
    cursor: pointer;
    font-size: 11px;
    color: var(--color-text-tertiary);
    width: auto;
    display: inline-flex;
    align-items: center;

    transition: opacity 0.15s, background 0.15s;
  }
  .todo-card:hover .add-btn { opacity: 1; }
  .add-btn:hover { background: var(--color-bg-secondary); color: var(--color-text-primary); }
  .add-task-row { display: flex; gap: 4px; margin-top: 4px; }
  .add-task-row input { flex: 1; height: 28px; font-size: 12px; padding: 0 8px; }

  .due-pill {

  }
  .due-pill.urgent { background: #FCEBEB; color: #791F1F; }
  .due-pill.soon { background: #FAEEDA; color: #633806; }

  /* Dashboard : 4 zones de remontée */
  .dash-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
    margin-bottom: 1.25rem;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  .dash-wrap {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    flex: 1;
    min-width: 0;
    max-width: 100%;
  }
  @media (max-width: 1100px) {
    .dash-wrap { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .dash-row { flex-direction: column; }
    .dash-wrap { grid-template-columns: 1fr; }
  }

  /* Minuteur */
  .timer-panel {
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-md);
    padding: 10px;
    width: 120px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  @media (max-width: 700px) {
    .timer-panel { width: 100%; flex-direction: row; align-items: center; }
  }
  .timer-display {
    font-family: 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    color: var(--color-text-primary);
    background: var(--color-bg-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-sm);
    padding: 8px 4px;
    cursor: pointer;
    user-select: none;
    letter-spacing: 0.5px;
  }
  .timer-display:hover { background: var(--color-bg-tertiary); }
  .timer-display.finished {
    animation: timer-blink 0.8s steps(1) infinite;
  }
  @keyframes timer-blink {
    50% { background: #C62828; color: #FFFFFF; border-color: #C62828; }
  }
  .timer-edit-input {
    font-family: 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    padding: 8px 4px;
    border: 1px solid var(--color-border-info);
    border-radius: var(--radius-sm);
    background: var(--color-bg-primary);
    color: var(--color-text-primary);
    outline: none;
    box-sizing: border-box;
  }
  .timer-body {
    display: flex;
    gap: 8px;
    flex: 1;
  }
  .timer-gauge {
    width: 22px;
    flex-shrink: 0;
    background: var(--color-bg-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-sm);

    min-height: 90px;
    display: flex;
    flex-direction: column-reverse;

  }
  .timer-buttons {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }
  @media (max-width: 700px) {
    .timer-gauge { min-height: 44px; width: 44px; }
    .timer-buttons { flex-direction: row; }
  }
  .timer-btn {
    background: var(--color-bg-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    padding: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-secondary);

  }
  .timer-btn:hover { background: var(--color-bg-tertiary); color: var(--color-text-primary); }
  .timer-btn.active { background: #1565C0; color: #FFFFFF; border-color: #1565C0; }
  .timer-btn i { font-size: 15px; }
  .dash-zone {
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-md);
    padding: 10px 12px;

    flex-direction: column;

  }
  .dash-zone-head {

  .dash-zone-head .count {

  .dash-items {

    gap: 3px;

  .dash-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 7px;
    border-radius: 4px;
    font-size: 12.5px;
    cursor: pointer;
    line-height: 1.35;
    user-select: none;
  }
  .dash-item:hover { background: var(--color-bg-secondary); }
  .dash-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-primary); font-weight: 500; }
  .dash-item-due {

    background: #D32F2F;
    font-weight: 700;
    font-size: 11.5px;
  }
  .dash-item-due.soon {
    color: #FFFFFF;
    background: #EF8C00;
    font-weight: 700;
    font-size: 11.5px;
  }
  .dash-item-marker {

  .dash-empty {

  .dash-tab-chip {
    display: inline-flex;

    font-size: 9.5px;
    color: var(--color-text-secondary);
    background: var(--color-bg-tertiary);
    padding: 2px 5px;

  /* Mise en valeur des listes et tâches */
  .todo-card.highlighted {
    box-shadow: 0 0 0 2px #F5C518, 0 0 0 3px rgba(245, 197, 24, 0.25);
  }
  .dash-item.highlighted {
    box-shadow: 0 0 0 1.5px #F5C518, 0 0 0 2.5px rgba(245, 197, 24, 0.25);
  }
  .todo-item.highlighted {

  .highlight-btn {

  .arrow-stack { display: flex; flex-direction: column; gap: 0; }
  .arrow-stack .icon-btn { padding: 0 2px; line-height: 0.9; height: 11px; }

  /* Écran de connexion Google */
  .auth-screen {
    min-height: 70vh;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;

  .auth-screen h2 {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 0.5rem;
    color: var(--color-text-primary);
  }
  .auth-screen p {
    font-size: 14px;
    color: var(--color-text-secondary);

    line-height: 1.6;
    margin: 0.5rem 0;
  }

    background: #FFFFFF;
    color: #3C4043;
    border: 1px solid #DADCE0;

  /* Indicateur de statut sync */
  .sync-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    transition: all 0.2s;
  }
  .sync-indicator.idle {
    background: #EAF3DE;
    color: #27500A;
  }
  .sync-indicator.saving {
    background: #FAEEDA;
    color: #633806;
  }
  .sync-indicator.error {
    background: #FCEBEB;
    color: #791F1F;
  }
  /* Quand l'indicateur est un button (mode erreur), il devient cliquable visiblement */
  button.sync-indicator.error {
    border: 0.5px solid #A32D2D;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  button.sync-indicator.error:hover {
    background: #F8DADA;
  }
  .sync-indicator i {
    font-size: 11px;
  }
  .sync-indicator.saving i {
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .user-chip {

  .inbox-popup-body {

  }
  .inbox-item {

    border: 0.5px solid var(--color-border-tertiary);

    flex-shrink: 0;
  }
  .inbox-item-body { flex: 1; min-width: 0; }
  .inbox-item-action { font-size: 13px; color: var(--color-text-primary); line-height: 1.4; }
  .inbox-item-quote {
    font-size: 11px;
    color: var(--color-text-secondary);
    font-style: italic;
    margin-top: 4px;
    padding-left: 8px;
    border-left: 2px solid var(--color-border-tertiary);
  }
  .inbox-item-time {
    font-size: 10px;
    color: var(--color-text-tertiary);
    margin-top: 4px;
  }
  .inbox-popup-foot {
    padding: 12px 18px;
    border-top: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .inbox-popup-foot button {
    padding: 6px 12px;
    font-size: 13px;
  }
  .inbox-apply-btn {
    background: var(--color-bg-info) !important;
    color: var(--color-text-info) !important;
    border-color: var(--color-border-info) !important;
    font-weight: 500;
  }

  /* Bouton récurrent : rond gris, isolé */
  .recurring-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-secondary);
    color: var(--color-text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    padding: 0;
  }
  .recurring-btn:hover { background: #E8E6DE; color: var(--color-text-primary); }
  .recurring-btn.active {
    background: #444441 !important;
    color: #FFFFFF !important;
    border-color: #444441 !important;
  }
  .recurring-btn .ti { font-size: 16px; }

  /* Vue récurrente : remplace les colonnes */
  .recurring-view {
    background: var(--color-bg-tertiary);
    border-radius: var(--radius-md);
    padding: 16px;
    min-height: 300px;
  }
  .recurring-view-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .recurring-view-header h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--color-text-primary);
  }
  .rec-zone {
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .rec-zone-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }
  .rec-zone-title {
    flex: 1;
    background: transparent;
    border: 0.5px solid transparent;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary);
    padding: 3px 6px;
    border-radius: 4px;
  }
  .rec-zone-title:hover { border-color: var(--color-border-tertiary); background: var(--color-bg-secondary); }
  .rec-zone-title:focus { border-color: var(--color-border-secondary); background: var(--color-bg-secondary); outline: none; }
  .rec-zone-empty {
    font-size: 12px;
    color: var(--color-text-tertiary);
    padding: 8px 4px;
    font-style: italic;
  }
  .recurring-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .recurring-card {
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .recurring-card.upcoming { border-left: 3px solid #BA7517; }
  .recurring-card.today { border-left: 3px solid #A32D2D; background: #FCEBEB; }
  .recurring-card-emoji { font-size: 16px; }
  .recurring-card-title { flex: 1; min-width: 0; }
  .recurring-card-title .name { font-weight: 500; }
  .recurring-card-title .meta {
    font-size: 11px;
    color: var(--color-text-tertiary);
    margin-top: 2px;
  }
  .recurring-card .next-date {
    font-size: 12px;
    background: var(--color-bg-secondary);
    color: var(--color-text-secondary);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .recurring-card.today .next-date { background: #F9D6D6; color: #6B1A1A; font-weight: 500; }
  .recurring-card.upcoming .next-date { background: #FAEEDA; color: #633806; }

  .rec-done-btn {
    background: #EAF3DE;
    color: #27500A;
    border: 0.5px solid #639922;
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .rec-done-btn:hover { background: #D8EBC0; }

  .freq-pick {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .freq-opt {
    padding: 5px 10px;
    border: 0.5px solid var(--color-border-tertiary);
    background: transparent;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    color: var(--color-text-secondary);
  }
  .freq-opt.selected {
    background: var(--color-bg-info);
    color: var(--color-text-info);
    border-color: var(--color-border-info);
    font-weight: 500;
  }
  .weekday-pick {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .weekday-opt {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 0.5px solid var(--color-border-tertiary);
    background: transparent;
    cursor: pointer;
    font-size: 11px;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weekday-opt.selected {
    background: var(--color-bg-info);
    color: var(--color-text-info);
    border-color: var(--color-border-info);
    font-weight: 500;
  }

  /* Pastille distinctive pour récurrences dans le calendrier */
  .cal-dot.recurring {
    border-radius: 0;
    width: 5px;
    height: 5px;
    transform: rotate(45deg);
  }

  .layout-main {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 20px;
    align-items: flex-start;
  }
  .layout-main.cal-hidden {
    grid-template-columns: 1fr;
  }
  .layout-main.cal-hidden #cal-wrap { display: none; }
  .cal-toggle {
    position: absolute;
    top: 0; right: 0;
    background: var(--color-bg-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    cursor: pointer;
    font-size: 11px;
    color: var(--color-text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    z-index: 5;
  }
  .cal-toggle:hover { background: var(--color-bg-secondary); color: var(--color-text-primary); }
  @media (max-width: 1300px) {
    .col-wrap.cols-4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 1100px) {
    .col-wrap.cols-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 800px) {
    .layout-main { grid-template-columns: 1fr; }
    .col-wrap.cols-3, .col-wrap.cols-4 { grid-template-columns: 1fr; }
  }
</style>
</head>

  let memoryStore = {};

  function setSyncStatus(status, label) {
    const slot = document.getElementById('sync-indicator-slot');
    if (!slot) return;
    if (!status) { slot.innerHTML = ''; return; }
    const icons = { idle: 'ti-cloud-check', saving: 'ti-loader-2', error: 'ti-cloud-off' };
    // En mode erreur, l'indicateur devient un bouton cliquable pour relancer la sync.
    if (status === 'error') {
      slot.innerHTML = `<button class="sync-indicator error" id="sync-retry-btn" title="Cliquer pour relancer la synchronisation"><i class="ti ${icons.error}"></i>${label || 'erreur sync'} · réessayer</button>`;
      const btn = document.getElementById('sync-retry-btn');
      if (btn) btn.onclick = manualResync;
    } else {
      slot.innerHTML = `<span class="sync-indicator ${status}"><i class="ti ${icons[status]}"></i>${label || ''}</span>`;
    }
  }

  // Resynchronisation manuelle : déclenchée par clic sur l'indicateur d'erreur.
  // Si le jeton OAuth a expiré (cause la plus fréquente), on redemande l'accès.
  // Renouvellement silencieux du jeton OAuth avant expiration.
  // Le jeton Google dure ~1h. On déclenche un renouvellement à 50 min : si la
  // session Google du navigateur est toujours active (cas normal pour un usage
  // perso), Google retourne un nouveau jeton sans aucune interaction.
  let tokenRefreshTimer = null;

  function scheduleTokenRefresh(expiresInSec) {
    if (tokenRefreshTimer) { clearTimeout(tokenRefreshTimer); tokenRefreshTimer = null; }
    // Marge : on renouvelle 10 min avant l'expiration annoncée par Google.
    const ttl = (parseInt(expiresInSec, 10) || 3600);
    const refreshInMs = Math.max(60, ttl - 600) * 1000;
    tokenRefreshTimer = setTimeout(refreshTokenSilently, refreshInMs);
  }

  function refreshTokenSilently() {
    if (!tokenClient) return;
    try {
      // On installe un callback temporaire qui ne touche QUE au renouvellement,
      // sans interrompre l'app ni afficher d'écran de connexion.
      const origCallback = tokenClient.callback;
      tokenClient.callback = (resp) => {
        tokenClient.callback = origCallback;
        if (resp.error) {
          // Échec silencieux : on ne dérange pas l'utilisateur, le bouton
          // "Réessayer" prendra le relais si une sauvegarde échoue plus tard.
          console.warn('Renouvellement silencieux du jeton refusé', resp.error);
          return;
        }
        accessToken = resp.access_token;
        try {
          const newTtl = (parseInt(resp.expires_in, 10) || 3600) - 60;
          sessionStorage.setItem('marcus_gtoken', JSON.stringify({
            token: resp.access_token,
            expiry: Date.now() + newTtl * 1000
          }));
        } catch (_) {}
        // On programme le prochain renouvellement
        scheduleTokenRefresh(resp.expires_in);
      };
      // prompt:'' = aucune interaction utilisateur si la session Google est active
      tokenClient.requestAccessToken({ prompt: '' });
    } catch (e) {
      console.warn('Renouvellement silencieux impossible', e);
    }
  }

  async function manualResync() {
    if (saveInFlight) return;
    setSyncStatus('saving', 'reconnexion...');
    try {
      // Tentative directe avec le jeton courant
      await driveWriteData(memoryStore);
      lastSaveError = null;
      setSyncStatus('idle', 'à jour');
      flashWarning('Synchronisation rétablie');
      return;
    } catch (e) {
      console.warn('Première tentative échouée, on tente une reconnexion', e);
    }
    // Si on est ici, c'est que la sync directe a échoué. On demande un nouveau jeton.
    if (!tokenClient) { setSyncStatus('error', 'erreur sync'); return; }
    try {
      // Stocke un callback temporaire pour rejouer la sync après obtention du nouveau jeton
      const origCallback = tokenClient.callback;
      tokenClient.callback = async (resp) => {
        // On rétablit le callback d'origine pour les futurs appels
        tokenClient.callback = origCallback;
        if (resp.error) {
          setSyncStatus('error', 'erreur sync');
          return;
        }
        accessToken = resp.access_token;
        try {
          const ttl = (parseInt(resp.expires_in, 10) || 3600) - 60;
          sessionStorage.setItem('marcus_gtoken', JSON.stringify({
            token: resp.access_token,
            expiry: Date.now() + ttl * 1000
          }));
        } catch (_) {}
        // Nouvelle tentative de sync avec le jeton frais
        try {
          await driveWriteData(memoryStore);
          lastSaveError = null;
          setSyncStatus('idle', 'à jour');
          flashWarning('Synchronisation rétablie');
        } catch (err2) {
          console.error('Échec après reconnexion', err2);
          setSyncStatus('error', 'erreur sync');
        }
      };
      tokenClient.requestAccessToken({ prompt: '' });
    } catch (e) {
      console.error('Reconnexion impossible', e);
      setSyncStatus('error', 'erreur sync');
    }
  }

    if (saveInFlight) { saveQueued = true; return; }

    } catch (e) {

      lastSaveError = e;
      setSyncStatus('error', 'erreur sync');

          if (loaded && typeof loaded === 'object') state.columns = loaded;
        }
      }
      if (dm?.value) state.dayMarks = JSON.parse(dm.value);
      if (rec?.value) state.recurring = JSON.parse(rec.value);
      if (recZ?.value) {
        const z = JSON.parse(recZ.value);
        if (Array.isArray(z) && z.length > 0) state.recurringZones = z;
      }
      if (dp?.value) {
        try {
          const pal = JSON.parse(dp.value);
          if (Array.isArray(pal) && pal.length > 0) DAY_PALETTE = pal;
        } catch (e) { console.warn('palette jour illisible', e); }
      }
      // Migration : assigner les récurrences sans zoneId à la première zone
      const firstZoneId = state.recurringZones[0]?.id;
      state.recurring.forEach(r => {
        if (!r.zoneId) r.zoneId = firstZoneId;
        if (!r.doneHistory) r.doneHistory = r.lastDone ? [r.lastDone] : [];
      });

      // Migration : assure que chaque onglet de TABS a ses colonnes et son tableau de listes
      TAB_IDS.forEach(t => {
        if (!state.columns[t]) state.columns[t] = defaultColsFor(t);
        if (!state.lists[t]) state.lists[t] = [];
      });
      // Migration CATT.CORP → NEST (renommage d'onglet de la version précédente)
      if (state.lists['CATT.CORP'] && state.lists['CATT.CORP'].length > 0 && state.lists.NEST.length === 0) {
        state.lists.NEST = state.lists['CATT.CORP'];
        state.columns.NEST = state.columns['CATT.CORP'] || state.columns.NEST;
        delete state.lists['CATT.CORP'];
        delete state.columns['CATT.CORP'];
        save();
        saveCols();
      }
      // Migration HER : si seulement 3 colonnes, en ajouter une 4e (Axe 4)
      if (state.columns.HER && state.columns.HER.length === 3) {
        state.columns.HER.push({ id: 'c'+Math.random().toString(36).slice(2,7), name: 'Axe 4' });
        saveCols();
      }
      TAB_IDS.forEach(tab => {
        const firstCol = state.columns[tab][0]?.id;
        state.lists[tab].forEach(l => {
          if (!l.columnId) l.columnId = firstCol;
        });
      });
    } catch (e) { console.warn('load', e); }
    render();
  }
  function save() { storage.set('pro_lists', JSON.stringify(state.lists)); }
  function saveCols() { storage.set('pro_columns', JSON.stringify(state.columns)); }
  function saveDayMarks() { storage.set('pro_day_marks', JSON.stringify(state.dayMarks)); }
  function saveRecurring() { storage.set('pro_recurring', JSON.stringify(state.recurring)); }
  function saveRecurringZones() { storage.set('pro_recurring_zones', JSON.stringify(state.recurringZones)); }
  function saveDayPalette() { storage.set('pro_day_palette', JSON.stringify(DAY_PALETTE)); }

  // Conversion JJ/MM (UI) ↔ MM-DD (stockage)
  function ddmmToStorage(s) {
    if (!s) return '';
    const m = s.trim().match(/^(\d{1,2})[\/\-\.](\d{1,2})$/);
    if (!m) return '';
    const dd = String(parseInt(m[1], 10)).padStart(2, '0');
    const mm = String(parseInt(m[2], 10)).padStart(2, '0');
    if (parseInt(dd, 10) < 1 || parseInt(dd, 10) > 31) return '';
    if (parseInt(mm, 10) < 1 || parseInt(mm, 10) > 12) return '';
    return `${mm}-${dd}`;
  }
  function storageToDdmm(s) {
    if (!s) return '';
    const m = s.match(/^(\d{2})-(\d{2})$/);
    if (!m) return '';
    return `${m[2]}/${m[1]}`;
  }

  // ============ RÉCURRENCES ============
  // Modèle d'une tâche récurrente :
  // { id, title, emoji, color, freq: 'weekly'|'monthly'|'yearly'|'interval',
  //   weekdays: [1..7] (lundi=1, dimanche=7) pour weekly
  //   monthDay: 1..31 pour monthly
  //   yearDate: 'MM-DD' pour yearly
  //   intervalValue: int, intervalUnit: 'day'|'week'|'month' pour interval
  //   startDate: 'YYYY-MM-DD' (référence pour interval, ou date d'origine)
  //   lastDone: 'YYYY-MM-DD' (dernière fois marquée faite, optionnel)
  // }

  // Génère toutes les occurrences d'une tâche récurrente entre fromDate et toDate (inclus)
  function getOccurrencesInRange(rec, fromDate, toDate) {
    const occ = [];
    const from = parseDate(typeof fromDate === 'string' ? fromDate : toIsoDate(fromDate));
    const to = parseDate(typeof toDate === 'string' ? toDate : toIsoDate(toDate));
    if (!from || !to) return occ;

    if (rec.freq === 'weekly') {
      const days = rec.weekdays || [];
      if (days.length === 0) return occ;
      const cursor = new Date(from);
      while (cursor <= to) {
        const wd = ((cursor.getDay() + 6) % 7) + 1; // 1=lundi..7=dimanche
        if (days.includes(wd)) occ.push(toIsoDate(cursor));
        cursor.setDate(cursor.getDate() + 1);
      }
    } else if (rec.freq === 'monthly') {
      const day = rec.monthDay;
      if (!day) return occ;
      // Pour chaque mois entre from et to
      const cursor = new Date(from.getFullYear(), from.getMonth(), 1);
      while (cursor <= to) {
        const lastDayOfMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
        const targetDay = Math.min(day, lastDayOfMonth);
        const date = new Date(cursor.getFullYear(), cursor.getMonth(), targetDay);
        if (date >= from && date <= to) occ.push(toIsoDate(date));
        cursor.setMonth(cursor.getMonth() + 1);
      }
    } else if (rec.freq === 'yearly') {
      if (!rec.yearDate) return occ;
      const [mm, dd] = rec.yearDate.split('-').map(Number);
      for (let y = from.getFullYear(); y <= to.getFullYear(); y++) {
        const lastDay = new Date(y, mm, 0).getDate();
        const date = new Date(y, mm - 1, Math.min(dd, lastDay));
        if (date >= from && date <= to) occ.push(toIsoDate(date));
      }
    } else if (rec.freq === 'interval') {
      if (!rec.startDate || !rec.intervalValue) return occ;
      const start = parseDate(rec.startDate);
      const unit = rec.intervalUnit || 'day';
      const step = parseInt(rec.intervalValue, 10);
      if (!start || step <= 0) return occ;
      const cursor = new Date(start);
      // Avancer jusqu'à entrer dans la plage
      while (cursor < from) {
        if (unit === 'day') cursor.setDate(cursor.getDate() + step);
        else if (unit === 'week') cursor.setDate(cursor.getDate() + step * 7);
        else if (unit === 'month') cursor.setMonth(cursor.getMonth() + step);
        else break;
      }
      while (cursor <= to) {
        occ.push(toIsoDate(cursor));
        if (unit === 'day') cursor.setDate(cursor.getDate() + step);
        else if (unit === 'week') cursor.setDate(cursor.getDate() + step * 7);
        else if (unit === 'month') cursor.setMonth(cursor.getMonth() + step);
        else break;
      }
    }
    return occ;
  }

  // Renvoie la prochaine occurrence d'une récurrence à partir de fromDate (incluse).
  // Si la tâche a un doneHistory non vide, on cherche après la dernière entrée
  function getNextOccurrence(rec, fromDate) {
    const from = fromDate || today();
    let searchFrom = from;
    const lastDoneStr = (rec.doneHistory && rec.doneHistory.length > 0)
      ? rec.doneHistory[rec.doneHistory.length - 1]
      : rec.lastDone;
    if (lastDoneStr) {
      const last = parseDate(lastDoneStr);
      if (last >= from) {
        searchFrom = new Date(last);
        searchFrom.setDate(searchFrom.getDate() + 1);
      }
    }
    const limit = new Date(searchFrom);
    limit.setFullYear(limit.getFullYear() + 3);
    const occ = getOccurrencesInRange(rec, searchFrom, limit);
    return occ.length > 0 ? occ[0] : null;
  }

  function toIsoDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function describeRecurrence(rec) {
    if (rec.freq === 'weekly') {
      const names = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
      const wd = (rec.weekdays || []).map(d => names[d-1]).join(', ');
      return wd ? 'Hebdo : ' + wd : 'Hebdo';
    }
    if (rec.freq === 'monthly') return 'Le ' + (rec.monthDay || '?') + ' de chaque mois';
    if (rec.freq === 'yearly') {
      if (!rec.yearDate) return 'Annuel';
      const [mm, dd] = rec.yearDate.split('-');
      const months = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
      return `Chaque année le ${parseInt(dd,10)} ${months[parseInt(mm,10)-1]}`;
    }
    if (rec.freq === 'interval') {
      const units = { day: 'jour(s)', week: 'semaine(s)', month: 'mois' };
      return `Tous les ${rec.intervalValue || '?'} ${units[rec.intervalUnit] || ''}`;
    }
    return '';
  }

  function sortRecurringByNext() {
    const t = today();
    return [...state.recurring].map(r => ({
      rec: r,
      next: getNextOccurrence(r, t)
    })).sort((a, b) => {
      if (!a.next && !b.next) return 0;
      if (!a.next) return 1;
      if (!b.next) return -1;
      return a.next.localeCompare(b.next);
    });
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
  function parseDate(s) { if (!s) return null; const d = new Date(s); d.setHours(0,0,0,0); return d; }
  function fmtDate(s) {
    if (!s) return '';
    const d = parseDate(s);
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
  }
  function escape(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Convertit une couleur (#rrggbb) en hex propre pour input type=color
  function rgbToHex(c) {
    if (!c) return '#cccccc';
    c = c.trim();
    if (c[0] === '#') {
      if (c.length === 7) return c.toLowerCase();
      if (c.length === 4) return ('#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3]).toLowerCase();
    }
    return '#cccccc';
  }
  // À partir d'une couleur de fond claire choisie, dérive une couleur de texte foncée lisible
  function darkenForText(hex) {
    hex = rgbToHex(hex);
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    // On assombrit fortement (40% de la valeur) pour le texte
    const dr = Math.round(r*0.35), dg = Math.round(g*0.35), db = Math.round(b*0.35);
    return '#' + [dr,dg,db].map(v => ('0'+v.toString(16)).slice(-2)).join('');
  }

  function syncModalInputsToState() {
    if (!state.editingList) return;
    const t = document.getElementById('m-title');
    const f = document.getElementById('m-final');
    const i = document.getElementById('m-inter');
    const c = document.getElementById('m-col');
    const tb = document.getElementById('m-tab');
    if (t) state.editingList.title = t.value;
    if (f) state.editingList.dueFinal = f.value;
    if (i) state.editingList.dueIntermediate = i.value;
    if (c) state.editingList.columnId = c.value;
    if (tb) state.editingList._targetTab = tb.value;
  }

  function getNextDueDate(list) {
    if (list.dueIntermediate) return parseDate(list.dueIntermediate);
    if (list.dueFinal) return parseDate(list.dueFinal);
    return null;
  }
  function isOverdue(list) {
    const d = getNextDueDate(list);
    if (!d) return false;
    return d < today();
  }
  function sortLists(lists) {
    return [...lists].sort((a, b) => {
      if (a.pinned && !b.pinned) return -1;
      if (!a.pinned && b.pinned) return 1;
      const da = getNextDueDate(a);
      const db = getNextDueDate(b);
      if (!da && !db) return 0;
      if (!da) return 1;
      if (!db) return -1;
      return da - db;
    });
  }
  function getColor(id) { return COLORS.find(c => c.id === id) || COLORS.find(c => c.id === 'blue') || COLORS[0]; }
  function getDayMark(id) { return DAY_PALETTE.find(p => p.id === id); }

  function getDuePill(list) {
    const d = getNextDueDate(list);
    if (!d) return '';
    const diff = Math.round((d - today()) / 86400000);
    let cls = 'due-pill';
    if (diff < 0) cls += ' urgent';
    else if (diff <= 3) cls += ' soon';
    const label = list.dueIntermediate ? fmtDate(list.dueIntermediate) : fmtDate(list.dueFinal);
    return `<span class="${cls}">${label}</span>`;
  }

  function renderTask(task, listId, depth, siblings, idx) {
    const subCls = depth === 1 ? ' sub' : depth === 2 ? ' sub sub-2' : '';
    const subs = (task.subs || []).map((s, i) => renderTask(s, listId, depth + 1, task.subs, i)).join('');
    const canAddSub = depth < 2;
    const isAddingHere = state.addingTaskTo === `${listId}::${task.id}`;
    const isFirst = idx === 0;
    const isLast = idx === siblings.length - 1;
    const hlClass = task.highlighted ? ' highlighted' : '';
    const hlBtnClass = task.highlighted ? 'highlight-btn is-on' : 'highlight-btn';
    const isEditing = state.editingTask === `${listId}::${task.id}`;
    const textCell = isEditing
      ? `<input type="text" class="task-edit-input" id="task-edit-input" value="${escape(task.text)}" data-list="${listId}" data-task="${task.id}" />`
      : `<div class="task-text ${task.done ? 'done' : ''}" data-action="edit-task-text" data-list="${listId}" data-task="${task.id}" title="Cliquer pour modifier">${escape(task.text)}</div>`;
    return `
      <div class="todo-item${subCls}${hlClass}" data-task-id="${task.id}" data-task-depth="${depth}" data-task-list="${listId}">
        <div class="drag-handle" data-drag-handle="${task.id}" title="Glisser pour réorganiser">⋮⋮</div>
        <div class="check ${task.done ? 'done' : ''}" data-action="toggle" data-list="${listId}" data-task="${task.id}"></div>
        ${textCell}
        <div class="task-controls">
          <div class="arrow-stack">
            <button class="icon-btn" data-action="move-task" data-list="${listId}" data-task="${task.id}" data-dir="up" ${isFirst?'disabled style="opacity:0.25"':''} title="Monter"><i class="ti ti-chevron-up" style="font-size:11px"></i></button>
            <button class="icon-btn" data-action="move-task" data-list="${listId}" data-task="${task.id}" data-dir="down" ${isLast?'disabled style="opacity:0.25"':''} title="Descendre"><i class="ti ti-chevron-down" style="font-size:11px"></i></button>
          </div>
          <button class="${hlBtnClass}" data-action="toggle-hl-task" data-list="${listId}" data-task="${task.id}" title="Mettre en valeur"><i class="ti ti-highlight" style="font-size:12px"></i></button>
          ${canAddSub ? `<button class="icon-btn" data-action="add-sub" data-list="${listId}" data-task="${task.id}" title="Sous-tâche"><i class="ti ti-plus" style="font-size:12px"></i></button>` : ''}
          <button class="icon-btn" data-action="del-task" data-list="${listId}" data-task="${task.id}" title="Supprimer"><i class="ti ti-x" style="font-size:12px"></i></button>
        </div>
      </div>
      ${isAddingHere ? `
        <div class="add-task-row" style="padding-left: ${(depth+1) * 18}px">
          <input type="text" id="new-task-input" placeholder="Sous-tâche..." />
          <button class="icon-btn" data-action="confirm-task" data-list="${listId}" data-parent="${task.id}"><i class="ti ti-check"></i></button>
          <button class="icon-btn" data-action="cancel-task"><i class="ti ti-x"></i></button>
        </div>
      ` : ''}
      ${subs}
    `;
  }

  function renderList(list) {
    const c = getColor(list.color);
    const tasks = list.tasks || [];
    const tasksHtml = tasks.map((t, i) => renderTask(t, list.id, 0, tasks, i)).join('');
    const isAddingTop = state.addingTaskTo === `${list.id}::ROOT`;
    const overdue = isOverdue(list);
    const overdueWhich = overdue
      ? (list.dueIntermediate && parseDate(list.dueIntermediate) < today() ? 'inter' : 'final')
      : null;
    const pinIcon = list.pinned ? 'ti-pin-filled' : 'ti-pin';
    const pinClass = list.pinned ? 'pin-btn is-pinned' : 'pin-btn';
    const pinTitle = list.pinned ? 'Désépingler' : 'Épingler';
    const hlClass = list.highlighted ? 'highlight-btn is-on' : 'highlight-btn';
    const hlTitle = list.highlighted ? 'Retirer la mise en valeur' : 'Mettre en valeur';
    return `
      <div class="todo-card ${overdue ? 'overdue' : ''} ${list.highlighted ? 'highlighted' : ''}" draggable="true" data-list-drag="${list.id}">
        <div class="todo-header" style="background: ${c.bg}; color: ${c.text};">
          <span style="font-size:14px">${list.emoji || ''}</span>
          <span style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap" title="${escape(list.title)}">${escape(list.title)}</span>
          ${overdue ? `<span class="alert-badge" title="Échéance ${overdueWhich === 'inter' ? 'intermédiaire' : 'finale'} dépassée"><i class="ti ti-alert-triangle" style="font-size:10px"></i></span>` : ''}
          ${getDuePill(list)}
          <button class="${hlClass}" data-action="toggle-hl-list" data-list="${list.id}" title="${hlTitle}"><i class="ti ti-highlight" style="font-size:13px"></i></button>
          <button class="icon-btn" data-action="edit-list" data-list="${list.id}" title="Modifier" style="color:${c.text}"><i class="ti ti-edit" style="font-size:13px"></i></button>
          <button class="${pinClass}" data-action="pin-list" data-list="${list.id}" title="${pinTitle}"><i class="ti ${pinIcon}"></i></button>
        </div>
        <div class="todo-body">
          ${tasksHtml || '<div style="font-size:12px; color:var(--color-text-tertiary); padding:3px 0">Aucune tâche</div>'}
          ${isAddingTop ? `
            <div class="add-task-row">
              <input type="text" id="new-task-input" placeholder="Nouvelle tâche..." />
              <button class="icon-btn" data-action="confirm-task" data-list="${list.id}" data-parent=""><i class="ti ti-check"></i></button>
              <button class="icon-btn" data-action="cancel-task"><i class="ti ti-x"></i></button>
            </div>
          ` : `
            <button class="add-btn" data-action="show-add-task" data-list="${list.id}" data-parent="" style="margin-top:4px"><i class="ti ti-plus" style="font-size:11px"></i> Tâche</button>
          `}
        </div>
      </div>
    `;
  }

  function renderColumns() {
    const cols = state.columns[state.tab];
    const tabLists = state.lists[state.tab] || [];
    const colCountClass = cols.length === 4 ? 'cols-4' : 'cols-3';
    return `
      <div class="col-wrap ${colCountClass}">
        ${cols.map(col => {
          const inCol = sortLists(tabLists.filter(l => l.columnId === col.id));
          const isOver = state.dragOverCol === col.id;
          return `
            <div class="col ${isOver ? 'drag-over' : ''}" data-col-drop="${col.id}">
              <div class="col-head">
                <input class="col-title" data-action="rename-col" data-col="${col.id}" value="${escape(col.name)}" />
                <span style="font-size: 11px; color: var(--color-text-tertiary)">${inCol.length}</span>
              </div>
              ${inCol.length === 0
                ? `<div class="empty-col">Glisser une liste ici</div>`
                : inCol.map(renderList).join('')}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function getDueOnDate(dateStr) {
    const allLists = [];
    TAB_IDS.forEach(t => {
      (state.lists[t] || []).forEach(l => allLists.push({...l, _tab: t}));
    });
    const items = [];
    allLists.forEach(l => {
      if (l.dueIntermediate === dateStr) items.push({ list: l, type: 'intermédiaire', color: getColor(l.color).border });
      if (l.dueFinal === dateStr) items.push({ list: l, type: 'finale', color: getColor(l.color).border });
    });
    // Récurrences tombant ce jour
    const d = parseDate(dateStr);
    if (d) {
      state.recurring.forEach(rec => {
        const occs = getOccurrencesInRange(rec, d, d);
        if (occs.length > 0) {
          items.push({
            list: { title: rec.title, color: rec.color },
            type: 'récurrence : ' + describeRecurrence(rec).toLowerCase(),
            color: getColor(rec.color).border,
            _tab: 'récurrent'
          });
        }
      });
    }
    return items;
  }

  function renderCalendar() {
    const t = today();
    const months = [];
    for (let i = 0; i < 3; i++) months.push(new Date(t.getFullYear(), t.getMonth() + i, 1));

    const allLists = [];
    TAB_IDS.forEach(t => { allLists.push(...(state.lists[t] || [])); });
    const dueMap = {};
    allLists.forEach(l => {
      [l.dueIntermediate, l.dueFinal].forEach(d => {
        if (d) {
          if (!dueMap[d]) dueMap[d] = [];
          dueMap[d].push({ color: getColor(l.color).border, kind: 'list' });
        }
      });
    });

    // Ajout des occurrences de récurrences dans la plage des 3 mois affichés
    const firstMonthStart = new Date(months[0].getFullYear(), months[0].getMonth(), 1);
    const lastMonthEnd = new Date(months[2].getFullYear(), months[2].getMonth() + 1, 0);
    state.recurring.forEach(rec => {
      const occs = getOccurrencesInRange(rec, firstMonthStart, lastMonthEnd);
      occs.forEach(d => {
        if (!dueMap[d]) dueMap[d] = [];
        dueMap[d].push({ color: getColor(rec.color).border, kind: 'recurring' });
      });
    });

    return months.map(m => {
      const year = m.getFullYear();
      const month = m.getMonth();
      const monthName = m.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const firstDay = new Date(year, month, 1).getDay();
      const offset = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const days = [];
      for (let i = 0; i < offset; i++) days.push('<div></div>');
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dayDate = parseDate(dateStr);
        const isToday = dayDate.getTime() === t.getTime();
        const isPast = dayDate < t;
        const dow = dayDate.getDay(); // 0 = dimanche, 6 = samedi
        const isWeekend = (dow === 0 || dow === 6);
        const dots = dueMap[dateStr] || [];
        const mark = state.dayMarks[dateStr];
        // Priorité : marque utilisateur > couleur week-end > rien
        let markStyle = '';
        if (mark) {
          markStyle = `background: ${getDayMark(mark)?.bg}; color: ${getDayMark(mark)?.text};`;
        } else if (isWeekend) {
          markStyle = `background: ${WEEKEND_COLOR.bg}; color: ${WEEKEND_COLOR.text};`;
        }
        const cls = ['cal-day'];
        if (isPast) cls.push('past');
        if (isToday) cls.push('today');
        if (dots.length) cls.push('has-due');
        if (isWeekend && !mark) cls.push('weekend');
        days.push(`
          <div class="${cls.join(' ')}" style="${markStyle}" data-action="cal-click" data-date="${dateStr}">
            <span>${d}</span>
            ${dots.length ? `<div style="display:flex; gap:1px; align-items:center">${dots.slice(0,3).map(dot => `<div class="cal-dot${dot.kind === 'recurring' ? ' recurring' : ''}" style="background:${dot.color}"></div>`).join('')}</div>` : ''}
          </div>
        `);
      }
      return `
        <div style="margin-bottom: 14px;">
          <div style="font-size: 12px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 4px; text-transform: capitalize;">${monthName}</div>
          <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; font-size: 10px; color: var(--color-text-tertiary); margin-bottom: 2px;">
            ${['L','M','M','J','V','S','D'].map(d => `<div style="text-align:center">${d}</div>`).join('')}
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;">
            ${days.join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderRecurringView() {
    const t = today();
    const todayStr = toIsoDate(t);
    const weekFromNow = new Date(t);
    weekFromNow.setDate(weekFromNow.getDate() + 3);
    const weekStr = toIsoDate(weekFromNow);

    // Tri par prochaine occurrence à l'intérieur de chaque zone
    function renderRecCard({rec, next}) {
      const c = getColor(rec.color);
      let cls = 'recurring-card';
      let dateLabel = '—';
      if (next) {
        const d = new Date(next);
        dateLabel = d.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
      }
      if (next === todayStr) cls += ' today';
      else if (next && next <= weekStr) cls += ' upcoming';
      const canUndo = (rec.doneHistory && rec.doneHistory.length > 0);
      return `
        <div class="${cls}" style="${cls.includes('today') || cls.includes('upcoming') ? '' : 'border-left: 3px solid '+c.border+';'}">
          <div class="recurring-card-emoji">${rec.emoji || '🔁'}</div>
          <div class="recurring-card-title">
            <div class="name" style="color: ${c.text}">${escape(rec.title)}</div>
            <div class="meta">${escape(describeRecurrence(rec))}</div>
          </div>
          <span class="next-date">${dateLabel}</span>
          ${next ? `<button class="rec-done-btn" data-action="rec-done" data-rec="${rec.id}" title="Marquer fait et repousser à la prochaine occurrence">
            <i class="ti ti-check" style="font-size:12px"></i> Fait
          </button>` : ''}
          ${canUndo ? `<button class="icon-btn" data-action="rec-undo" data-rec="${rec.id}" title="Annuler le dernier 'Fait'">
            <i class="ti ti-arrow-back-up" style="font-size:13px"></i>
          </button>` : ''}
          <button class="icon-btn" data-action="rec-edit" data-rec="${rec.id}" title="Modifier">
            <i class="ti ti-edit" style="font-size:13px"></i>
          </button>
          <button class="icon-btn" data-action="rec-delete" data-rec="${rec.id}" title="Supprimer" style="color: #A32D2D">
            <i class="ti ti-trash" style="font-size:13px"></i>
          </button>
        </div>
      `;
    }

    return `
      <div class="recurring-view">
        <div class="recurring-view-header">
          <i class="ti ti-repeat" style="font-size:18px; color: var(--color-text-secondary)"></i>
          <h2>Tâches récurrentes</h2>
          <span style="font-size:12px; color: var(--color-text-tertiary)">${state.recurring.length} au total</span>
        </div>

        ${state.recurringZones.map(zone => {
          const itemsInZone = sortRecurringByNext().filter(({rec}) => (rec.zoneId || state.recurringZones[0].id) === zone.id);
          return `
            <div class="rec-zone">
              <div class="rec-zone-head">
                <input class="rec-zone-title" data-action="rename-rec-zone" data-zone="${zone.id}" value="${escape(zone.name)}" />
                <span style="font-size:11px; color:var(--color-text-tertiary)">${itemsInZone.length}</span>
                <button data-action="new-recurring-in" data-zone="${zone.id}" class="icon-btn" title="Ajouter dans cette zone">
                  <i class="ti ti-plus" style="font-size:13px"></i>
                </button>
              </div>
              ${itemsInZone.length === 0
                ? `<div class="rec-zone-empty">Aucune récurrence dans cette zone.</div>`
                : `<div class="recurring-list">${itemsInZone.map(renderRecCard).join('')}</div>`
              }
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

          ` : ''}

          ${freq === 'interval' ? `
            <label>Tous les...</label>
            <div style="display:flex; gap:6px; align-items:center">
              <input type="number" id="rec-interval-val" min="1" value="${r.intervalValue || 1}" style="width:80px" />
              <select id="rec-interval-unit" style="flex:1">
                <option value="day" ${r.intervalUnit === 'day' ? 'selected' : ''}>jour(s)</option>
                <option value="week" ${r.intervalUnit === 'week' ? 'selected' : ''}>semaine(s)</option>
                <option value="month" ${r.intervalUnit === 'month' ? 'selected' : ''}>mois</option>
              </select>

          ` : ''}

          <label>Couleur</label>
          <div class="color-pick">
            ${COLORS.map(c => `<div class="color-swatch ${r.color === c.id ? 'selected' : ''}" data-action="rec-pick-color" data-color="${c.id}" style="background:${c.bg}; ${r.color === c.id ? 'border-color:'+c.border : ''}"></div>`).join('')}
          </div>

          <label>Emoji</label>
          <div class="emoji-pick">
            <button class="emoji-opt ${!r.emoji ? 'selected' : ''}" data-action="rec-pick-emoji" data-emoji="">∅</button>
            ${['🎂','🎉','🔔','💊','💧','💼','📞','✉️','🧹','🚿','🏋️','📅'].map(e => `<button class="emoji-opt ${r.emoji === e ? 'selected' : ''}" data-action="rec-pick-emoji" data-emoji="${e}">${e}</button>`).join('')}
          </div>

          <div style="display:flex; gap:8px; margin-top:16px; justify-content:flex-end">
            <button data-action="cancel-rec-modal">Annuler</button>
